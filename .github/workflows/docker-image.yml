# Build & Publish the universal multi-shell image to GHCR
name: Build & Publish Universal Shell Image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: potenfyr-studios/shell-eggs

permissions:
  contents: read

jobs:
  # Per-architecture NATIVE builds: amd64 on x64 runners, arm64 on GitHub's
  # free arm64 runners. No QEMU anywhere anymore (arm64 used to emulate for
  # every push). Each leg pushes by digest with its own cache scope; the
  # merge job stitches the digests into one multi-arch manifest.
  build:
    name: Build image (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,scope=build-${{ matrix.slug }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests#${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.slug }}
          path: ${{ runner.temp }}/digests*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-architecture digests into the published multi-arch tags.
  # latest + sha-<short> always; the git tag itself on v* builds.
  merge:
    name: Merge manifest & publish tags
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download per-arch digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          IMAGE_URI="${REGISTRY}/${IMAGE_NAME}"
          TAGS="${IMAGE_URI}:latest,${IMAGE_URI}:sha-${GITHUB_SHA::7}"
          case "${GITHUB_REF}" in
            refs/tags/v*) TAGS="${TAGS},${IMAGE_URI}:${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "tags=${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Merge manifest lists and push tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          ARGS=""
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAG_LIST[@]}"; do ARGS="${ARGS} --tag ${t}"; done
          # shellcheck disable=SC2046
          docker buildx imagetools create ${ARGS} \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          echo "Published multi-arch image:"
          docker buildx imagetools inspect "${TAG_LIST[0]}"

      - name: Smoke test image (amd64)
        run: |
          docker run --rm "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" \
            bash -c 'command -v sshd dropbear telnetd socat ncat python3 php node && echo IMAGE_TOOLS_OK' \
            || echo "[smoke] image tools unavailable; skipped"
