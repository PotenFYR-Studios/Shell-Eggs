name: Question
description: Ask a question about Shell-Eggs usage, configuration, or shell selection.
title: "[question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Context
      description: What are you trying to do? Which panel or Docker?
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Any variables you set, shells you tested, or docs you read.
