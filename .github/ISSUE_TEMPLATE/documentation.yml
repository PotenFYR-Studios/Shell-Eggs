name: Documentation
description: Report missing, outdated, or incorrect documentation.
title: "[docs] "
labels: ["documentation"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs to be documented or fixed?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: README, SHELLs.md, docs site, inline comments?
      placeholder: "SHELLs.md, docs site /docs/shells/..."
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested content
      description: If you have a draft or specific phrasing, include it here.
