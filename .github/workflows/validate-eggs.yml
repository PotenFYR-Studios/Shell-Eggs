name: Validate Eggs & Scripts

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Egg JSON and Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate JSON syntax
        run: |
          echo "Validating egg-shell-multi.json..."
          jq empty egg-shell-multi.json
          if [ -d eggs ]; then
            for egg in eggs/*.json; do
              echo "Validating ${egg}..."
              jq empty "${egg}"
            done
          fi
          echo "All Egg JSON files are strictly valid."

      - name: Lint Shell Scripts
        run: |
          for sh_file in *.sh scripts/*.sh tests/*.sh; do
            if [ -f "${sh_file}" ]; then
              echo "Checking syntax of ${sh_file}..."
              bash -n "${sh_file}"
            fi
          done
          echo "All shell scripts passed syntax check."

      - name: Python Syntax (telnetd + payload templates)
        run: |
          python3 -m py_compile scripts/telnetd.py
          echo "Python runtime files compile."

      - name: Registry coverage check (every id has a handler)
        run: |
          bash tests/test-coverage.sh

      - name: Payload emission check (every reverse payload renders)
        run: |
          bash tests/test-payloads.sh
