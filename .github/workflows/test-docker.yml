# Boot-tests real shells inside the built image (fast, single-arch)
name: Shell Boot Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-tests:
    name: Boot-test shells in Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t shell-eggs:ci .

      - name: SSH password login + SFTP + generated credentials
        run: |
          docker run -d --name t1 shell-eggs:ci sleep 900
          docker exec t1 bash -c '
            cd /home/container
            SHELL_TYPE=ssh SHELL_USERS=alice SHELL_PASSWORDS=testpass SERVER_PORT=2222 \
              PANEL_STOP_WATCHER=0 AUTO_UPDATE_EGG=0 bash /usr/local/bin/run.sh >/tmp/b.log 2>&1 &
            for i in $(seq 1 45); do ss -ltn | grep -q :2222 && break; sleep 1; done
            sshpass -p testpass ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -p 2222 alice@127.0.0.1 "echo SSH_LOGIN_OK" | grep -q SSH_LOGIN_OK'

      - name: SSH CA certificate login + principal enforcement
        run: |
          docker exec t1 bash -c '
            cd /home/container
            SERVER_PORT=2299 SHELL_TYPE=ssh-cert SHELL_USERS=carol \
              PANEL_STOP_WATCHER=0 AUTO_UPDATE_EGG=0 bash /usr/local/bin/run.sh >/tmp/c.log 2>&1 &
            for i in $(seq 1 45); do ss -ltn | grep -q :2299 && break; sleep 1; done
            ssh -i .ssh-ca/carol -o CertificateFile=.ssh-ca/carol-cert.pub \
                -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p 2299 \
                carol@127.0.0.1 "echo CERT_LOGIN_OK" | grep -q CERT_LOGIN_OK
            if ssh -i .ssh-ca/carol -o CertificateFile=.ssh-ca/carol-cert.pub \
                -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -p 2299 \
                mallory@127.0.0.1 true 2>/dev/null; then echo "PRINCIPAL_BYPASS"; exit 1; fi'

      - name: Telnet login (shadow auth)
        run: |
          docker cp scripts/telnet-check.py t1:/tmp/telnet-check.py
          docker exec t1 bash -c '
            cd /home/container
            SERVER_PORT=2323 SHELL_TYPE=telnetd SHELL_USERS=carol SHELL_PASSWORDS=carolpass \
              PANEL_STOP_WATCHER=0 AUTO_UPDATE_EGG=0 bash /usr/local/bin/run.sh >/tmp/t.log 2>&1 &
            for i in $(seq 1 45); do ss -ltn | grep -q :2323 && break; sleep 1; done
            python3 /tmp/telnet-check.py'

      - name: Reverse shells reach an external listener
        run: |
          docker cp tests/reverse-e2e.py t1:/tmp/e2e.py
          docker exec t1 bash -c '
            cd /home/container
            SHELL_TYPE=python SHELL_REVERSE_HOST=127.0.0.1 SHELL_REVERSE_PORT=4460 \
              SERVER_PORT=2222 PANEL_STOP_WATCHER=0 AUTO_UPDATE_EGG=0 bash /usr/local/bin/run.sh >/tmp/r.log 2>&1 &
            for i in $(seq 1 20); do ps aux | grep -q "[p]ython.run" && break; sleep 1; done
            sleep 2
            sed "s/4471/4460/" /tmp/e2e.py > /tmp/e2e4460.py
            python3 /tmp/e2e4460.py | tee /tmp/e2e-result.log
            grep -q TALKS /tmp/e2e-result.log'

      - name: TLS bind shell roundtrip
        run: |
          docker exec t1 bash -c '
            cd /home/container
            SERVER_PORT=5566 SHELL_TYPE=openssl-bind PANEL_STOP_WATCHER=0 AUTO_UPDATE_EGG=0 \
              setsid bash /usr/local/bin/run.sh >/tmp/tls.log 2>&1 &
            for i in $(seq 1 20); do
              ss -ltn | grep -q 5566 && break
              sleep 1
            done
            echo "echo TLS_MARKER" | timeout 6 socat - OPENSSL:127.0.0.1:5566,verify=0 2>/dev/null | grep -a TLS_MARKER'

      - name: Cleanup
        if: always()
        run: docker rm -f t1 2>/dev/null || true
