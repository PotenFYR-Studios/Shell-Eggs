name: Bug Report
description: Something in the egg, image, or docs site is not working as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much as you can.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Pterodactyl / Pelican / Feather / Wisp / Docker? Version?
      placeholder: "Pterodactyl 1.x, Docker 27.x"
    validations:
      required: true
  - type: input
    id: shell-type
    attributes:
      label: SHELL_TYPE
      description: Which shell(s) were you using?
      placeholder: "ssh, ssh-cert, python-pty..."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and include any relevant console output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set SHELL_TYPE=...
        2. Set SHELL_USERS=...
        3. Start the server
        4. See error
    validations:
      required: true
