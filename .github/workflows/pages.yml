name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "SHELLs.md"
      - "README.md"
      - "egg-shell-multi.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Vite site (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile || bun install

      - name: Sync live data from repo (auto-update source of truth)
        working-directory: docs
        run: |
          bun run scripts/sync-data.ts
          echo "catalog + egg data synced from repo root"

      - name: Build
        working-directory: docs
        run: bun run build
        env:
          VITE_REPO: PotenFYR-Studios/Shell-Eggs

      - name: SPA fallback
        working-directory: docs
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
